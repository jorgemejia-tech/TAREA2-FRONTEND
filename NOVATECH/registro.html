<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de clientes - NOVATECH</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecera">
        <div class="logo">
            <img src="img/logo.png" alt="Logotipo de NOVATECH">
            <span>NOVATECH</span>
        </div>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="index.html#productos">Productos</a>
            <a href="index.html#servicios">Servicios</a>
            <a href="registro.html">Registro de clientes</a>
            <a href="index.html#contacto">Contacto</a>
        </nav>
    </header>

    <main class="contenedor">
        <h1 class="titulo-pagina">Registro de clientes</h1>

        <form action="#" method="post" class="formulario">

            <!-- 1. DATOS PERSONALES -->
            <fieldset>
                <legend>Datos personales</legend>

                <label for="cedula">Cédula:</label>
                <input type="text" id="cedula" name="cedula" required
                       minlength="10" maxlength="10" pattern="[0-9]{10}"
                       title="Ingrese 10 dígitos numéricos" placeholder="0912345678">

                <label for="nombres">Nombres:</label>
                <input type="text" id="nombres" name="nombres" required
                       minlength="2" maxlength="50"
                       pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                       title="Solo letras y espacios">

                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" required
                       minlength="2" maxlength="50"
                       pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                       title="Solo letras y espacios">

                <label for="nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="nacimiento" name="nacimiento" required
                       min="1920-01-01" max="2008-12-31">

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" required min="18" max="100">

                <p class="etiqueta">Género:</p>
                <div class="opciones">
                    <label><input type="radio" name="genero" value="masculino" required> Masculino</label>
                    <label><input type="radio" name="genero" value="femenino"> Femenino</label>
                    <label><input type="radio" name="genero" value="otro"> Otro</label>
                </div>
            </fieldset>

            <!-- 2. DATOS DE CONTACTO -->
            <fieldset>
                <legend>Datos de contacto</legend>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required
                       maxlength="80" placeholder="usuario@correo.com">

                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required
                       minlength="10" maxlength="10" pattern="09[0-9]{8}"
                       title="Debe iniciar con 09 y tener 10 dígitos" placeholder="0987654321">

                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" required
                       minlength="5" maxlength="100">

                <label for="ciudad">Ciudad:</label>
                <select id="ciudad" name="ciudad" required>
                    <option value="">-- Seleccione una ciudad --</option>
                    <option value="guayaquil">Guayaquil</option>
                    <option value="quito">Quito</option>
                    <option value="cuenca">Cuenca</option>
                    <option value="manta">Manta</option>
                    <option value="ambato">Ambato</option>
                    <option value="loja">Loja</option>
                </select>
            </fieldset>

            <!-- 3. PREFERENCIAS -->
            <fieldset>
                <legend>Preferencias del cliente</legend>

                <p class="etiqueta">Productos de interés:</p>
                <div class="opciones">
                    <label><input type="checkbox" name="productos" value="computadoras"> Computadoras</label>
                    <label><input type="checkbox" name="productos" value="impresoras"> Impresoras</label>
                    <label><input type="checkbox" name="productos" value="accesorios"> Accesorios</label>
                    <label><input type="checkbox" name="productos" value="celulares"> Celulares</label>
                </div>

                <p class="etiqueta">Servicios de interés:</p>
                <div class="opciones">
                    <label><input type="checkbox" name="servicios" value="mantenimiento"> Mantenimiento</label>
                    <label><input type="checkbox" name="servicios" value="reparacion"> Reparación</label>
                    <label><input type="checkbox" name="servicios" value="soporte"> Soporte técnico</label>
                </div>

                <label for="foto">Fotografía del cliente (opcional):</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </fieldset>

            <!-- 4. CONFIRMACIÓN -->
            <fieldset>
                <legend>Confirmación</legend>

                <div class="opciones">
                    <label>
                        <input type="checkbox" name="terminos" required>
                        Acepto los términos y condiciones
                    </label>
                </div>

                <div class="botones">
                    <button type="submit" class="btn-registrar">Registrar</button>
                    <button type="reset" class="btn-limpiar">Limpiar</button>
                </div>
            </fieldset>

        </form>
    </main>

    <footer class="pie">
        <p>&copy; 2026 NOVATECH. Todos los derechos reservados.</p>
        <p>
            <a href="index.html">Inicio</a> |
            <a href="registro.html">Registro de clientes</a>
        </p>
    </footer>

</body>
</html>
